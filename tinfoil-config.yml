cvm-version: 0.10.4
cpus: 8
memory: 16384

containers:
  - name: "summarizer"
    image: "ghcr.io/tinfoilsh/confidential-summarizer@sha256:fb98f48dbaf15c238af7a6080a5123399994789813509cc3357c635c5970d5a1" # v0.1.11
    restart: always
    networks: [web]
    env:
      - SUMMARY_MODEL: "llama3-3-70b"
    secrets:
      - TINFOIL_API_KEY

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /summarize
    - /health
