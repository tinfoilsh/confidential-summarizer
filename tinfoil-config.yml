cvm-version: 0.10.4
cpus: 8
memory: 16384

containers:
  - name: "summarizer"
    image: "ghcr.io/tinfoilsh/confidential-summarizer@sha256:bc2f5d56ec6698259d190f7eb499683fccc155cbd1e192d205a3b369da6c7376" # v0.1.13
    restart: always
    networks: [web]
    env:
      - SUMMARY_MODEL: "gpt-oss-120b"
    secrets:
      - TINFOIL_API_KEY

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /summarize
    - /health
