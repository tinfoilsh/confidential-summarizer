cvm-version: 0.14.15
cpus: 8
memory: 16384

containers:
  - name: "summarizer"
    image: "ghcr.io/tinfoilsh/confidential-summarizer@sha256:609a5c41f86d9e93e950ffdf13052501a2834dc69ac5190351c112bfeaee566c" # v0.1.16
    restart: always
    networks: [web]
    env:
      - SUMMARY_MODEL: "llama3-3-70b"
    secrets:
      - TINFOIL_API_KEY

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /summarize
    - /health
