cvm-version: 0.14.15
cpus: 8
memory: 16384

containers:
  - name: "summarizer"
    image: "ghcr.io/tinfoilsh/confidential-summarizer@sha256:6b7174f04f91e460be006e465cb2f606779612f252ebd43975e81668c6822c81" # v0.1.17
    restart: always
    networks: [web]
    env:
      - SUMMARY_MODEL: "llama3-3-70b"
    secrets:
      - TINFOIL_API_KEY

networks:
  web:
    egress: open

shim:
  upstream-port: 8089
  paths:
    - /summarize
    - /health
